name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: antigravity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      # Advisory until the v2 agent code is fully typed and lint-clean.
      - name: Lint (ruff)
        working-directory: backend
        continue-on-error: true
        run: ruff check app/ --output-format=github

      - name: Type check (mypy)
        working-directory: backend
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

      # Collection roots and import paths come from the repo-root pytest.ini;
      # tests/legacy_v1 (pre-v2 pipeline) is excluded in tests/conftest.py.
      - name: Unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/antigravity_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ag-backend:test backend/

      - name: Build scraper image
        run: docker build -t ag-scraper:test scraper/
