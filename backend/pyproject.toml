[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalio"
version = "0.1.0"
description = "Deterministic AI Commerce Engine for smartphones & laptops"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.4",

    # --- Pydantic ---
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # --- Redis ---
    "redis[hiredis]>=5.0.0",

    # --- Task queue ---
    "celery[redis]>=5.3.0",

    # --- AI / LLM ---
    "langgraph>=0.0.40",
    "langchain-core>=0.1.20",
    "langchain-openai>=0.0.5",
    "openai>=1.10.0",

    # --- Scraping ---
    "playwright>=1.41.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",

    # --- Observability ---
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "structlog>=24.1.0",

    # --- Utilities ---
    "httpx>=0.26.0",
    "numpy>=1.26.0",
    "orjson>=3.9.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = [
    "app",
    "app.agents",
    "app.api",
    "app.core",
    "app.experiments",
    "app.models",
    "app.schemas",
    "app.services",
    "app.workers"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-snapshot>=0.9.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (requires docker services)",
    "snapshot: Snapshot tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
